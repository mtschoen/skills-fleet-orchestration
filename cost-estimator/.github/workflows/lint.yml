name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: '**/*.md'
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff==0.15.15 mypy pytest pytest-cov
      - run: ruff check scripts/ ci/ tests/
      - run: mypy scripts/ ci/ --ignore-missing-imports
      - name: Run tests with coverage
        run: >-
          pytest tests/ --cov=scripts --cov=ci --cov-report=term-missing
          --cov-report=json:coverage.json
      - name: Post coverage status
        # Targets Gitea's /api/v1 status endpoint and is consumed only by
        # pr-crew, so skip it on GitHub where that endpoint does not exist.
        if: ${{ always() && github.server_url != 'https://github.com' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python ci/post-coverage-status.py
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: error
          scandir: '.'
